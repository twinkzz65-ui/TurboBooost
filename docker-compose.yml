services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: godgram
      POSTGRES_USER: godgram
      POSTGRES_PASSWORD: devpassword_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - godgram_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godgram -d godgram"]
      interval: 5s
      retries: 10
volumes:
  godgram_pg_data:
