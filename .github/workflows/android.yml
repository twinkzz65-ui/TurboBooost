name: build-android-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Интерфейс + res/ + gifts/ внутрь приложения
        env:
          SERVER_URL: ${{ vars.SERVER_URL || 'https://vexis-e6d8.onrender.com' }}
        run: python tools/prepare_web.py

      - name: Сборка APK
        env:
          SERVER_URL: ${{ vars.SERVER_URL || 'https://vexis-e6d8.onrender.com' }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/release/app-release.apk Vexis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vexis-apk
          path: Vexis.apk

      # Постоянная ссылка на свежий APK: Releases → «latest»
      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Vexis.apk --title "Vexis (последняя сборка)" --notes "Сборка ${{ github.run_number }}, коммит ${{ github.sha }}"
    permissions:
      contents: write
