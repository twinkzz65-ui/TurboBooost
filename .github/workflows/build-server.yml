name: Build server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - MyTelegram.GatewayServer
          - MyTelegram.AuthServer
          - MyTelegram.SessionServer
          - MyTelegram.Messenger.CommandServer
          - MyTelegram.Messenger.QueryServer
          - MyTelegram.BotApi
          - MyTelegram.Admin.Api
          - MyTelegram.SmsSender
          - MyTelegram.DataSeeder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish ${{ matrix.project }}
        run: >
          dotnet publish source/src/${{ matrix.project }}/${{ matrix.project }}.csproj
          -c Release -r linux-x64 --self-contained false
          -o out/${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: out/${{ matrix.project }}
