name: Build GodGram (.NET 8)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Compile, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: godgram
          POSTGRES_USER: godgram
          POSTGRES_PASSWORD: github_actions_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U godgram -d godgram"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      GODGRAM_DB: "Host=127.0.0.1;Port=5432;Database=godgram;Username=godgram;Password=github_actions_test_only"
      GODGRAM_DEV_CODES: "0"
      ASPNETCORE_URLS: "http://127.0.0.1:8090"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check project layout
        shell: bash
        run: |
          test -f GodGram.csproj
          test -f wwwroot/app.html
          test -f Database/schema.sql

      - name: Validate JavaScript files
        shell: bash
        run: |
          set -e
          for file in wwwroot/js/*.js; do
            node --check "$file"
          done

      - name: Restore dependencies
        run: dotnet restore GodGram.csproj

      - name: Compile release
        run: dotnet build GodGram.csproj --configuration Release --no-restore

      - name: Publish Windows x64 (standalone EXE)
        run: >-
          dotnet publish GodGram.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output artifacts/windows

      - name: Publish Linux x64
        run: >-
          dotnet publish GodGram.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output artifacts/linux

      - name: Smoke test Linux server and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifacts/linux/GodGram
          ./artifacts/linux/GodGram > "$RUNNER_TEMP/godgram.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ok=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:8090/api/health > "$RUNNER_TEMP/health.json"; then
              ok=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "GodGram failed to start with PostgreSQL"
            cat "$RUNNER_TEMP/godgram.log"
            exit 1
          fi

          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("ok") is True' "$RUNNER_TEMP/health.json"
          curl -fsS http://127.0.0.1:8090/app -o "$RUNNER_TEMP/app.html"
          grep -q '<title>GodGram</title>' "$RUNNER_TEMP/app.html"
          curl -fsS http://127.0.0.1:8090/styles.css -o /dev/null
          curl -fsS http://127.0.0.1:8090/js/core.js -o /dev/null
          echo "Smoke tests passed: PostgreSQL startup, API, /app, CSS and JS"

      - name: Package runnable applications
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/windows/GodGram.exe
          test -f artifacts/linux/GodGram
          test -f artifacts/windows/Database/schema.sql
          test -f artifacts/windows/wwwroot/app.html
          cp BUILD-INSTRUCTIONS.md artifacts/windows/README-BUILD.txt
          cp BUILD-INSTRUCTIONS.md artifacts/linux/README-BUILD.txt
          cp run-built.bat artifacts/windows/run-built.bat
          cp docker-compose.yml artifacts/windows/docker-compose.yml
          cp docker-compose.yml artifacts/linux/docker-compose.yml
          mkdir -p dist
          (cd artifacts/windows && zip -q -r ../../dist/GodGram-Windows-x64.zip .)
          (cd artifacts/linux && zip -q -r ../../dist/GodGram-Linux-x64.zip .)
          ls -lh dist/*

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GodGram-Windows-x64
          path: dist/GodGram-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: GodGram-Linux-x64
          path: dist/GodGram-Linux-x64.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODGRAM_SERVER_URL: ${{ vars.GODGRAM_SERVER_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web files and Capacitor project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node scripts/prepare-web.mjs
          npx cap add android
          node scripts/patch-native.mjs android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign APK
        working-directory: mobile
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "Секреты ключа не заданы: подписываю временным ключом (для обновлений поверх задайте ANDROID_KEYSTORE_*)"
            KS_PASS=godgram-temp-key; KS_ALIAS=godgram
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GodGram"
          fi
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" --out dist/GodGram.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify dist/GodGram.apk
          ls -lh dist/GodGram.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodGram-Android-APK
          path: mobile/dist/GodGram.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GODGRAM_SERVER_URL: ${{ vars.GODGRAM_SERVER_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare web files and Capacitor project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node scripts/prepare-web.mjs
          npx cap add ios
          node scripts/patch-native.mjs ios
          npx capacitor-assets generate --ios
          npx cap sync ios

      - name: Build app (no code signing)
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 40

      - name: Package IPA
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          rm -rf Payload && mkdir -p Payload ../../dist
          cp -R "$APP" Payload/
          zip -q -r ../../dist/GodGram-unsigned.ipa Payload
          ls -lh ../../dist/GodGram-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GodGram-iOS-IPA-unsigned
          path: mobile/dist/GodGram-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
